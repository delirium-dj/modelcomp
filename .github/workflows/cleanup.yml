name: Daily Vercel Cleanup
on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch: 

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch and Filter Deployments
        run: |
          PROJECT_ID="prj_0prkidewxqbh5khccp8ai17b3omh"
          TEAM_SLUG="delirium-djs-projects"
          
          # Calculate the epoch timestamp for 3 days ago in milliseconds
          THREE_DAYS_AGO=$(date -d "3 days ago" +%s%3N)
          
          echo "Fetching target deployment list from Vercel..."
          
          # Fixed endpoint syntax using the proper 'api.' subdomain, path structure, '$' syntax, and team parameters
          RESPONSE=$(curl -s -X GET \
            "https://vercel.com{PROJECT_ID}&teamId=${TEAM_SLUG}&limit=100" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json")
            
          # Verify we received a valid deployments array layout
          if ! echo "$RESPONSE" | jq -e '.deployments' > /dev/null; then
            echo "Error: Failed to fetch deployments or invalid token scope. Response received:"
            echo "$RESPONSE" | head -n 5
            exit 1
          fi

          # 2. Filter deployments older than 3 days that are NOT production targets
          echo "Filtering deployments..."
          DEPLOYMENTS_TO_DELETE=$(echo "$RESPONSE" | jq -c ".deployments[] | select(.target != \"production\" and .createdAt < ${THREE_DAYS_AGO})")

          if [ -z "$DEPLOYMENTS_TO_DELETE" ]; then
            echo "No old non-production deployments found matching deletion rules."
            exit 0
          fi

          # 3. Loop through and dispatch deletion requests
          echo "$DEPLOYMENTS_TO_DELETE" | while read -r deployment; do
            UID=$(echo "$deployment" | jq -r '.uid')
            URL=$(echo "$deployment" | jq -r '.url')
            
            echo "Deleting deployment: ${URL} (${UID})"
            
            # Appended teamId context to verify authorization permissions for targeted deletion blocks
            DELETE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              "https://vercel.com{UID}?teamId=${TEAM_SLUG}" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}")
              
            if [ "$DELETE_STATUS" = "200" ]; then
              echo "Successfully removed ${UID}"
            else
              echo "Failed to remove ${UID}. API responded with status: ${DELETE_STATUS}"
            fi
          done
