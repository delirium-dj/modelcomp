name: Daily Vercel Cleanup
on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch: 

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 24

      - name: Run Cleanup Script
        run: node cleanup.js
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
