name: Daily Vercel Cleanup
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-24.04 # Pinning to 24.04 silences the "ubuntu-latest migrating to 26" warning
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2 # Uses an updated release tag

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0 # Uses an updated release tag
        with:
          node-version: 24 # Switched from 20 to 24 to match the GitHub Actions runner native version

      - name: Run Cleanup Script
        run: node cleanup.js
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
