<!-- TeleAI (China Telecom) official wordmark; SVG supplied by the maintainer. Rendered via src/data/vendorIcons.extra.ts (teleai override). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%"><title>TeleAI</title>
  <defs>
    <!-- China Telecom / TeleAI Signature Tech Blue Gradient -->
    <linearGradient id="teleBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0054A6" />
      <stop offset="100%" stop-color="#00A0E9" />
    </linearGradient>
  </defs>
  <g transform="translate(20, 25)">
    <!-- Iconic Interlocking Neural Loop / Telecom Orbit Symbol -->
    <path d="M 40 50 C 40 20, 90 20, 90 50 C 90 80, 40 80, 40 50 Z" fill="none" stroke="url(#teleBlue)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 70 50 C 70 25, 115 25, 115 50 C 115 75, 70 75, 70 50 Z" fill="none" stroke="#00A0E9" stroke-width="8" stroke-dasharray="2 3" opacity="0.8"/>
    <circle cx="90" cy="50" r="7" fill="#0054A6" />
    <circle cx="40" cy="50" r="5" fill="#00A0E9" />
    <!-- TeleAI Typography -->
    <text x="145" y="62" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#0054A6" letter-spacing="-1">Tele</text>
    <text x="245" y="62" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#00A0E9" letter-spacing="-1">AI</text>
    <!-- Subtitle (China Telecom AI Research) -->
    <text x="148" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#718096" letter-spacing="3">CHINA TELECOM</text>
  </g>
</svg>
